
services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: green-citizen-db-prod
    environment:
      POSTGRES_DB: ${DB_NAME:-green_citizen}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    # Don't expose db port in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - green-network-prod

  # Redis Cache & Message Broker
  redis:
    image: redis:7-alpine
    container_name: green-citizen-redis-prod
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me}
    volumes:
      - redis_data_prod:/data
    # Don't expose redis port in production
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    networks:
      - green-network-prod

  # Django Web Application (Gunicorn)
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: green-citizen-web-prod
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py collectstatic --no-input &&
             gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 4 --worker-class sync --timeout 120"
    volumes:
      - static_volume_prod:/app/staticfiles
      - media_volume_prod:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-green_citizen}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change-me}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379/2
      - CELERY_RESULT_BACKEND=django-db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    networks:
      - green-network-prod
    expose:
      - 8000

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: green-citizen-celery-worker-prod
    command: celery -A core worker -l info --concurrency=4
    volumes:
      - media_volume_prod:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-green_citizen}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change-me}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379/2
      - CELERY_RESULT_BACKEND=django-db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - green-network-prod

  # Celery Beat (Task Scheduler)
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: green-citizen-celery-beat-prod
    command: celery -A core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=${DB_NAME:-green_citizen}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-change-me}
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-change-me}@redis:6379/2
      - CELERY_RESULT_BACKEND=django-db
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHANNEL_ID=${TELEGRAM_CHANNEL_ID}
    depends_on:
      - db
      - redis
    restart: always
    networks:
      - green-network-prod

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: green-citizen-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_volume_prod:/app/staticfiles:ro
      - media_volume_prod:/app/media:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
volumes:
  postgres_data_prod:
  redis_data_prod:
  static_volume_prod:
  media_volume_prod:
